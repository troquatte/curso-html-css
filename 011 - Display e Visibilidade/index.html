<!DOCTYPE html>
<html>
  <head>
    <title>Exemplo Completo</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Um exemplo completo de um documento HTML."
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="block">Eu sou um elemento block. <br /></div>
    <span class="inline">Eu sou um elemento inline.</span>
    <div class="none">Você não pode me ver!</div>

    <div class="hidden">Você não pode me ver, mas eu ainda estou aqui!</div>
    <div class="visible">Eu sou visível.</div>
  </body>
</html>
