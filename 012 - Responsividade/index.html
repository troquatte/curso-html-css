<!DOCTYPE html>
<html>
  <head>
    <title>Exemplo Completo</title>
    <meta charset="UTF-8" />
    <!-- 
      Definição: 
      O viewport é a área visível da página em um dispositivo. 
      Ele determina como a página é renderizada e exibida. 
      
      Como funciona: 
      Sem o viewport adequado, os navegadores podem renderizar 
      a página em um tamanho fixo, causando problemas de layout 
      em dispositivos móveis.
      
      Implementação: 
      Usar a tag <meta> para definir o viewport
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Um exemplo completo de um documento HTML."
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body></body>
</html>
